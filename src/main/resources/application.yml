server:
  port: 0
  servlet:
    context-path: /open-api
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/geo+json,text/plain
    min-response-size: 2KB

spring:
  application:
    name: sj-lab-openapi

openapi:
  api-key:
    # 키 발급·사용량 기능. 켜려면 DB 접속 정보가 필요하고, 표(map.openapi_api_key, map.openapi_api_usage)도
    # 미리 만들어져 있어야 한다(db/*.sql — DDL 실행은 담당자 몫). 꺼져 있거나 표가 없으면
    # 키 API 만 503 이고 공개 API 조회는 그대로 동작한다.
    enabled: ${OPENAPI_API_KEY_ENABLED:false}
    daily-quota: ${OPENAPI_API_KEY_DAILY_QUOTA:1000}
    datasource:
      # 저장소가 public 이라 접속 정보는 환경변수로만 받는다. 로컬은 .claude/settings.local.json,
      # 운영은 k8s Secret 에서 넣는다.
      url: ${OPENAPI_DB_URL:}
      username: ${OPENAPI_DB_USERNAME:}
      password: ${OPENAPI_DB_PASSWORD:}
  auth:
    # 로그인 확인은 sj-lab-authserver 에 맡긴다(JWT 서명 키를 복사해 두지 않기 위해).
    base-url: ${OPENAPI_AUTH_BASE_URL:http://SJ-LAB-AUTHSERVER}
  upstream:
    # 데이터는 직접 DB 를 읽지 않고 mapservice-rest 를 호출해 중계한다(같은 SQL 을 두 벌로 두지 않기 위해).
    # Eureka 서비스 이름으로 부르며, 로컬에서 게이트웨이를 통해 부르고 싶으면
    # OPENAPI_UPSTREAM_BASE_URL=http://localhost:8100 처럼 덮어쓴다.
    base-url: ${OPENAPI_UPSTREAM_BASE_URL:http://MAPSERVICE-REST}
    connect-timeout-ms: 3000
    read-timeout-ms: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info
